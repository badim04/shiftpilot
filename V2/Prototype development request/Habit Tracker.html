<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Habit Tracker — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800;1,400&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #E7E3DC;
    background-image: radial-gradient(120% 90% at 50% 0%, #EFEBE3 0%, #E2DDD4 70%);
    font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  /* force the cohesive type inside the device */
  .stage, .stage * { font-family: 'Hanken Grotesk', -apple-system, system-ui, sans-serif; }
  .stage {
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  .device-scale {
    transform: scale(var(--scale, 1));
    transform-origin: center center;
  }
  /* tidy scrollbars inside the phone */
  .stage ::-webkit-scrollbar { width: 0; height: 0; }
  button { font-family: inherit; }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="frames/ios-frame.jsx"></script>
  <script type="text/babel" src="app/store.jsx"></script>
  <script type="text/babel" src="app/components.jsx"></script>
  <script type="text/babel" src="app/screens.jsx"></script>
  <script type="text/babel" src="app/app.jsx"></script>

  <script>
    // fit the 402×874 device to the viewport
    function fit() {
      const W = 402, H = 874, pad = 32;
      const s = Math.min((window.innerWidth - pad) / W, (window.innerHeight - pad) / H);
      document.documentElement.style.setProperty('--scale', Math.min(s, 1.15));
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
