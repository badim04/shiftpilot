<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rota — Shift Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0E1116;
    font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  #root, .rota-root { font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif; }
  button { font-family: inherit; }
  h1 { font-family: inherit; }
  input, select, textarea { font-family: inherit; }

  @keyframes rotaPulse {
    0%   { transform: scale(0.7); opacity: 0.5; }
    70%  { transform: scale(1.7); opacity: 0; }
    100% { transform: scale(1.7); opacity: 0; }
  }

  /* rota grid affordances */
  .rota-cell { transition: border-color .12s, background .12s; }
  .rota-cell:hover { border-color: var(--accent) !important; }
  .rota-cell:empty:hover { background: var(--accent-soft) !important; }
  .rota-cell:empty:hover::after {
    content: '+'; display: flex; align-items: center; justify-content: center;
    width: 100%; color: var(--accent); font-size: 22px; font-weight: 700;
  }
  .shift-chip:hover .chip-x { display: flex !important; }

  /* thin scrollbars */
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.32); border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track { background: transparent; }

  select option { color: #111; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" rx="22" fill="#5B8DEF"/>

      <path d="M28 38h44M40 22v8M60 22v8" stroke="#0A0C10" stroke-width="4" stroke-linecap="round"/>
      <path d="M38 52l6 6 12-12" stroke="#0A0C10" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>

</body>
</html>
